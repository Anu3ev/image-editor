# Chromium is part of the reusable validation graph in validate.yml.
# This manual entry point is for full-suite diagnostics and grants no release authority.
name: Chromium diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.sha }}
      browser-mode: full
