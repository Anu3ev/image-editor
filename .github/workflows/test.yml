name: Validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.sha }}
      browser-mode: ${{ github.ref == 'refs/heads/master' && 'full' || 'smoke' }}
