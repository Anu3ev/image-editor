name: 🧪 Tests & Quality Checks

# Workflow for running tests on different Node.js versions
on:
  pull_request:
    branches: [ master, main ]  # Test only PRs targeting the main branches
  push:
    branches: [ master, main ]  # Check quality only on the main branches after merging

permissions:
  contents: read
  statuses: write
  issues: write
  pull-requests: write

jobs:
  test:
    name: "🔬 Test on Node.js ${{ matrix.node-version }}"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]  # Only the current LTS version
      fail-fast: false  # Keep other versions running if one fails

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🔧 Setup Node.js ${{ matrix.node-version }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: "📦 Install dependencies"
        run: |
          echo "🔍 Installing npm dependencies for Node.js ${{ matrix.node-version }}"
          npm ci
          echo "✅ Dependencies installed successfully"

      - name: "🔍 Run ESLint code quality check"
        run: |
          echo "🔍 Running ESLint on src/**/*.{js,ts} files"
          npm run lint
          echo "✅ Code quality check passed"

      - name: 🧪 Run Tests
        id: run-tests
        continue-on-error: true
        run: |
          echo "🧪 Running Jest tests with coverage on Node.js ${{ matrix.node-version }}"
          echo "📊 Test files pattern: specs/**/*.{test,spec}.ts"
          set +e  # Disable automatic exit on error
          npm run test:ci 2>&1 | tee test-output.log
          test_exit_code=${PIPESTATUS[0]}  # Get the exit code of npm, not tee
          set -e  # Re-enable automatic exit on error

          echo "🔍 Jest exit code: $test_exit_code"

          # Analyze the actual test results from the output
          if grep -q "Test Suites:.*failed" test-output.log; then
            echo "test_result=failure" >> $GITHUB_OUTPUT
            echo "❌ Some tests failed"
          elif grep -q "Tests:.*failed" test-output.log; then
            echo "test_result=failure" >> $GITHUB_OUTPUT
            echo "❌ Some tests failed"
          else
            # All tests passed; check coverage for a warning
            if [ $test_exit_code -ne 0 ] && grep -q "coverage threshold" test-output.log; then
              echo "test_result=success_low_coverage" >> $GITHUB_OUTPUT
              echo "✅ All tests passed, but coverage is low"
            elif [ $test_exit_code -eq 0 ]; then
              echo "test_result=success" >> $GITHUB_OUTPUT
              echo "✅ All tests passed successfully"
            else
              echo "test_result=failure" >> $GITHUB_OUTPUT
              echo "❌ Tests failed for unknown reason"
            fi
          fi

      - name: "📊 Generate detailed coverage report"
        if: always() && matrix.node-version == 20
        run: |
          echo "📊 Generating detailed coverage report for artifacts"
          npm run test:coverage
          echo "✅ Coverage report generated"

      - name: "📤 Upload coverage artifacts"
        if: always() && matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: "coverage-report-node${{ matrix.node-version }}"
          path: coverage/
          retention-days: 30

      - name: 💬 Update PR with Results
        if: always() && github.event.pull_request.number
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const nodeVersion = '${{ matrix.node-version }}';
            const testResult = '${{ steps.run-tests.outputs.test_result }}';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const reportMarker = '<!-- unit-test-report -->';
            const lowestCoverageFileCount = 10;
            const maxErrorLines = 10;
            const hasPassed = testResult === 'success' || testResult === 'success_low_coverage';
            const testOutput = fs.existsSync('test-output.log') ? fs.readFileSync('test-output.log', 'utf8') : '';

            /** Reads the counts from a Jest summary line, for example "2038 passed, 2038 total". */
            const readJestCounts = (label) => testOutput.match(new RegExp(`^${label}:\\s+(.+)$`, 'm'))?.[1];

            /** Builds the coverage totals and the files with the lowest line coverage. */
            const buildCoverageSection = () => {
              if (!fs.existsSync('coverage/coverage-summary.json')) return 'Coverage summary is not available.\n\n';

              const { total, ...files } = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const lowestCoverageRows = Object.entries(files)
                .sort(([, first], [, second]) => first.lines.pct - second.lines.pct)
                .slice(0, lowestCoverageFileCount)
                .map(([filePath, stats]) => `| \`${filePath.replace(`${process.cwd()}/`, '')}\` | ${stats.lines.pct}% | ${stats.functions.pct}% |`);
              const isLowCoverage = testResult === 'success_low_coverage' || total.lines.pct < 80;

              return [
                '| Lines | Functions | Branches | Statements |',
                '|---|---|---|---|',
                `| ${total.lines.pct}% | ${total.functions.pct}% | ${total.branches.pct}% | ${total.statements.pct}% |`,
                '',
                ...(isLowCoverage ? ['⚠️ Coverage is below the target.', ''] : []),
                '<details>',
                '<summary>Files with the lowest line coverage</summary>',
                '',
                '| File | Lines | Functions |',
                '|---|---|---|',
                ...lowestCoverageRows,
                '',
                '</details>',
                '',
                ''
              ].join('\n');
            };

            /** Builds the list of failed spec files and the first assertion lines from the Jest log. */
            const buildFailureSection = () => {
              const failedFiles = [...new Set(
                [...testOutput.matchAll(/FAIL\s+(.+\.spec\.ts)/g)].map(([, filePath]) => filePath)
              )];
              const errorLines = testOutput.split('\n').filter(line =>
                line.includes('Expected:') ||
                line.includes('Received:') ||
                line.includes('at Object.<anonymous>')
              );
              const failedFilesList = failedFiles.map(filePath => `- \`${filePath}\``).join('\n');
              const errorDetails = errorLines.slice(0, maxErrorLines).join('\n');

              return [
                failedFiles.length > 0 ? `**Failed files**\n\n${failedFilesList}\n\n` : '',
                errorLines.length > 0 ? `**First errors**\n\n\`\`\`\n${errorDetails}\n\`\`\`\n\n` : ''
              ].join('');
            };

            const counts = [
              readJestCounts('Tests') && `Tests: ${readJestCounts('Tests')}`,
              readJestCounts('Test Suites') && `Suites: ${readJestCounts('Test Suites')}`,
              `Commit: ${context.payload.pull_request.head.sha.slice(0, 7)}`
            ].filter(Boolean).join(' · ');

            const comment = [
              `${reportMarker}\n`,
              `### ${hasPassed ? '✅ Unit tests passed' : '❌ Unit tests failed'} · Node.js ${nodeVersion}\n\n`,
              `${counts}\n\n`,
              hasPassed ? buildCoverageSection() : buildFailureSection(),
              `[Logs and coverage report](${runUrl})\n`
            ].join('');

            console.log('💬 Looking for existing comment to update...');

            // Find an existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes(reportMarker)
            );

            if (botComment) {
              console.log('🔄 Updating existing comment...');
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
              console.log('✅ Comment updated successfully');
            } else {
              console.log('📝 Creating new comment...');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              console.log('✅ New comment created successfully');
            }

      - name: 📊 Set Commit Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const testResult = '${{ steps.run-tests.outputs.test_result }}';
            const nodeVersion = '${{ matrix.node-version }}';

            console.log(`📊 Test result: ${testResult} for Node.js ${nodeVersion}`);

            const state = (testResult === 'success' || testResult === 'success_low_coverage') ? 'success' : 'failure';
            const description = (testResult === 'success' || testResult === 'success_low_coverage')
              ? `✅ Tests passed on Node.js ${nodeVersion}${testResult === 'success_low_coverage' ? ' (low coverage)' : ''}`
              : `❌ Tests failed on Node.js ${nodeVersion}`;

            console.log(`🏷️ Creating commit status: ${state} - ${description}`);

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              target_url: `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              description: description,
              context: `tests/node-${nodeVersion}`
            });

            console.log('✅ Commit status created successfully');
