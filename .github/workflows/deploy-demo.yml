name: Deploy validated demo

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Exact successful Validate master-push run ID to redeploy (must still match master)
        type: string
        required: true

permissions:
  contents: read
  actions: read

# Serialize the entire prepare/deploy/verify sequence. The explicit master guard also
# rejects old queued completions; concurrency alone does not guarantee ordering.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  select:
    name: Select same-SHA trusted validation
    if: >-
      github.repository == 'Anu3ev/image-editor' &&
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' ||
       github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      run-id: ${{ steps.source.outputs.run-id }}
      build-id: ${{ steps.source.outputs.build-id }}
      attempt: ${{ steps.source.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - uses: actions/github-script@v7
        id: source
        env:
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.validation_run_id }}
        with:
          script: |
            const { validateSourceRun, assertCurrentMaster } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/validate-pages.mjs`);
            const runId = process.env.SOURCE_RUN_ID;
            if (!/^\d+$/.test(runId)) throw new Error('Supply an exact workflow run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(runId) });
            const identity = validateSourceRun(run);
            const { data: master } = await github.rest.repos.getBranch({ ...context.repo, branch: 'master' });
            assertCurrentMaster({ expectedSha: identity.sha, actualSha: master.commit.sha });
            core.setOutput('sha', identity.sha);
            core.setOutput('run-id', identity.runId);
            core.setOutput('build-id', identity.buildId);
            core.setOutput('attempt', String(run.run_attempt));

  prepare:
    name: Verify and prepare validated Pages artifact
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VALIDATED_SHA: ${{ needs.select.outputs.sha }}
      BUILD_ID: ${{ needs.select.outputs.build-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@v4
        with:
          name: validated-pages-${{ needs.select.outputs.attempt }}
          path: validated-pages
          run-id: ${{ needs.select.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: validation-evidence-${{ needs.select.outputs.attempt }}
          path: validation-evidence
          run-id: ${{ needs.select.outputs.run-id }}
          github-token: ${{ github.token }}
      - run: node scripts/validate-pages.mjs local
      - uses: actions/upload-pages-artifact@v3
        with:
          path: validated-pages

  deploy:
    name: Deploy and verify current master identity
    needs: [select, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VALIDATED_SHA: ${{ needs.select.outputs.sha }}
      BUILD_ID: ${{ needs.select.outputs.build-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@v4
        with:
          name: validation-evidence-${{ needs.select.outputs.attempt }}
          path: validation-evidence
          run-id: ${{ needs.select.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Reject a stale candidate immediately before deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { assertCurrentMaster } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/validate-pages.mjs`);
            const { data: master } = await github.rest.repos.getBranch({ ...context.repo, branch: 'master' });
            assertCurrentMaster({ expectedSha: process.env.VALIDATED_SHA, actualSha: master.commit.sha });
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Read back the live build identity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/validate-pages.mjs live
