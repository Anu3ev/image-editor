# Keep this filename: existing npm trusted-publisher configuration may identify it.
name: Promote validated release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full master SHA at dispatch time to validate and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-production-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve trusted master commit
    if: github.repository == 'Anu3ev/image-editor' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/github-script@v7
        id: commit
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        with:
          script: |
            const sha = process.env.REQUESTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Supply a full lowercase 40-character commit SHA');
            // npm provenance records the dispatch workflow SHA. Keep its source
            // identity identical to the commit whose tarball is being promoted.
            if (sha !== context.sha) throw new Error('Select the master SHA at dispatch time so npm provenance matches the validated package');
            const { data: master } = await github.rest.repos.getBranch({ ...context.repo, branch: 'master' });
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${sha}...${master.commit.sha}`
            });
            if (comparison.merge_base_commit.sha !== sha || !['ahead', 'identical'].includes(comparison.status)) {
              throw new Error('The selected SHA is not a trusted master commit');
            }
            core.setOutput('sha', sha);

  validation:
    needs: resolve
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      browser-mode: full

  publish:
    name: Publish exact validated tarball
    needs: [resolve, validation]
    if: needs.validation.result == 'success' && github.repository == 'Anu3ev/image-editor' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VALIDATED_SHA: ${{ needs.resolve.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Read release helpers from the trusted workflow commit, never from a PR or downloaded tarball.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: validated-package-${{ github.run_attempt }}
          path: package-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: validation-evidence-${{ github.run_attempt }}
          path: validation-evidence
      - name: Verify state, publish once without lifecycle scripts, and verify registry integrity
        run: node scripts/release-package.mjs publish
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90

  record-release:
    name: Record verified tag and GitHub release
    needs: [resolve, validation, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VALIDATED_SHA: ${{ needs.resolve.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: validated-package-${{ github.run_attempt }}
          path: package-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: validation-evidence-${{ github.run_attempt }}
          path: validation-evidence
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ github.run_attempt }}
          path: release-evidence
      - name: Verify registry again, then create only missing matching tag and release
        run: node scripts/release-package.mjs record
