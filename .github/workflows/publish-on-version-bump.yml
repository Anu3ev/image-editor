name: Publish

on:
  workflow_run:
    workflows: [Build and Deploy]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful master-push Build and Deploy run to recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  select:
    name: Select validated master artifact
    if: github.repository == 'Anu3ev/image-editor' && github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.build.outputs.artifact_id }}
      sha: ${{ steps.build.outputs.sha }}
      run_id: ${{ steps.build.outputs.run_id }}
      producer_attempt: ${{ steps.build.outputs.producer_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify source workflow and select immutable artifact
        id: build
        run: node scripts/release-package.mjs select
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}

  publish:
    name: Publish verified tarball to npm
    needs: select
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      published: ${{ steps.npm.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.select.outputs.artifact_id }}
          run-id: ${{ needs.select.outputs.run_id }}
          github-token: ${{ github.token }}
          path: package-artifacts
          merge-multiple: true
      - name: Verify bytes and publish once, or recover an identical publication
        id: npm
        run: node scripts/release-package.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ needs.select.outputs.sha }}
          BUILD_RUN_ID: ${{ needs.select.outputs.run_id }}
          PRODUCER_ATTEMPT: ${{ needs.select.outputs.producer_attempt }}

  record:
    name: Record verified npm release
    needs: [select, publish]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.select.outputs.artifact_id }}
          run-id: ${{ needs.select.outputs.run_id }}
          github-token: ${{ github.token }}
          path: package-artifacts
          merge-multiple: true
      - name: Verify npm again before creating the tag and release
        run: node scripts/release-package.mjs record
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ needs.select.outputs.sha }}
          BUILD_RUN_ID: ${{ needs.select.outputs.run_id }}
          PRODUCER_ATTEMPT: ${{ needs.select.outputs.producer_attempt }}
