name: Publish & Release on version bump

on:
  push:
    branches:
      - master
    paths:
      - 'package.json'

permissions:
  contents: write
  id-token: write

jobs:
  publish-and-release:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.release_info.outputs.TAG }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check package.json version bump
        id: check_bump
        run: |
          git diff --quiet HEAD^ HEAD -- package.json && {
            echo "package.json не менялся — пропускаем всё"
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          }
          PREVIOUS_VERSION=$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          VERSION=$(node -p "require('./package.json').version")
          if [ "$PREVIOUS_VERSION" != "$VERSION" ]; then
            echo "Обнаружен bump версии в package.json"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "package.json менялся, но версия осталась прежней — пропускаем"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve release version and tag
        id: release_info
        if: steps.check_bump.outputs.should_publish == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Check types and lint
        if: steps.check_bump.outputs.should_publish == 'true'
        run: |
          npm run typecheck
          npm run lint

      - name: Run unit tests
        if: steps.check_bump.outputs.should_publish == 'true'
        run: npm run test:ci -- --runInBand

      - name: Install Playwright Chromium
        if: steps.check_bump.outputs.should_publish == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        if: steps.check_bump.outputs.should_publish == 'true'
        run: npx playwright test --project=chromium --workers=2

      - name: Publish to npm
        if: steps.check_bump.outputs.should_publish == 'true'
        run: |
          VERSION="${{ steps.release_info.outputs.VERSION }}"

          echo "► Публикация пакета в npm (version=${VERSION})"
          npm publish --access public

  create-release:
    needs: publish-and-release
    if: needs.publish-and-release.outputs.TAG != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Git tag
        run: |
          TAG="${{ needs.publish-and-release.outputs.TAG }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Тэг $TAG уже существует → пропускаем его создание"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release (softprops)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.publish-and-release.outputs.TAG }}
          name: "Release ${{ needs.publish-and-release.outputs.TAG }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
